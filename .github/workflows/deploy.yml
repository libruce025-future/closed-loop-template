name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight deploy; the server also takes a flock.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Stay asleep until the repo variable DEPLOY_ENABLED is set to true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build
        run: |
          make install
          make check

      - name: Upload and switch release
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid sha" >&2; exit 1; }

          umask 077
          printf '%s\n' "$ECS_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

          SSH_OPTS=(-i "$RUNNER_TEMP/deploy_key"
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts"
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15)

          ssh "${SSH_OPTS[@]}" "$ECS_USER@$ECS_HOST" \
            "mkdir -p /opt/closed-loop/releases/$GIT_SHA"

          rsync -az --delete --chmod=D755,F644 \
            -e "ssh ${SSH_OPTS[*]}" \
            dist/ "$ECS_USER@$ECS_HOST:/opt/closed-loop/releases/$GIT_SHA/"

          ssh "${SSH_OPTS[@]}" "$ECS_USER@$ECS_HOST" \
            "sudo /usr/local/bin/deploy-ctl deploy $GIT_SHA"

      - name: Public smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            got="$(curl -fsS "$SITE_URL/version.json" | jq -r '.sha' 2>/dev/null || true)"
            if [[ "$got" == "$GIT_SHA" ]]; then
              echo "smoke ok: sha=$got"
              exit 0
            fi
            sleep 2
          done
          echo "smoke failed: expected=$GIT_SHA got=${got:-<none>}" >&2
          exit 1

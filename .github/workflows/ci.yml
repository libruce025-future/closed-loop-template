name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: make install

      - name: Lint and test
        run: make check

      - name: Build image
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          docker build --build-arg GIT_SHA="$SHA" -t app:ci .

      - name: Container smoke test
        run: |
          set -euo pipefail
          docker run -d --name app -p 127.0.0.1:3000:3000 app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/version
          docker logs app
          docker rm -f app

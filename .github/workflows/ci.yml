name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: make install

      - name: Lint, build and verify dist
        run: make check

      - name: Serve smoke test
        run: |
          set -euo pipefail
          PORT=3000 node scripts/serve.mjs &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/version.json >/dev/null 2>&1; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/ | grep -q '<main id="app">'
          curl -fsS http://127.0.0.1:3000/version.json \
            | jq -e --arg sha "$(git rev-parse HEAD)" '.sha == $sha' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/some/deep/route)" = "200"
          echo "serve smoke ok"
